app = "playdelcoleo-web"
primary_region = "iad"

[build]
  [build.args]
    VITE_API_URL = "https://api.playdelcoleo.co"

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
