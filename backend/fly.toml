app = "clubdelcoleo-api"
primary_region = "iad"

[build]

[env]
  DB_PATH = "/data/app.db"

[[mounts]]
  source = "clubdelcoleo_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
